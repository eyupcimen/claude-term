<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f343c"/>
      <stop offset="1" stop-color="#15171b"/>
    </linearGradient>
    <linearGradient id="meter" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4ec9b0"/>
      <stop offset="0.6" stop-color="#e5c07b"/>
      <stop offset="1" stop-color="#e8875b"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- macOS icon grid: 824px body inside a 1024 canvas -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#shadow)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="3"/>
  <!-- prompt -->
  <path d="M265 330 L415 450 L265 570" fill="none" stroke="#e8875b" stroke-width="58" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="460" y="535" width="210" height="56" rx="28" fill="#f2f2f2"/>
  <!-- usage meter -->
  <rect x="265" y="700" width="494" height="44" rx="22" fill="#ffffff" fill-opacity="0.10"/>
  <rect x="265" y="700" width="330" height="44" rx="22" fill="url(#meter)"/>
</svg>
