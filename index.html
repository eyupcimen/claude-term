<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>ClaudeTerm</title>
  <link rel="stylesheet" href="node_modules/@xterm/xterm/css/xterm.css" />
  <style>
    /* --- Theme tokens: dark by default, light via OS or the picker --- */
    :root {
      --bg: #111312;
      --bg-2: #161918;
      --bg-3: #232726;
      --selected: #2C3230;
      --tab-bg: #1B1E1D;
      --line: #2E3331;
      --text: #F2F3F2;
      --text-2: #A3ABA7;
      --text-3: #8A918E;
      --accent: #3CC4A5;
      --accent-soft: rgba(60,196,165,.16);
      --track: #2E3331;
      --static: #8A918E;
      --green: #4CC77A;
      --amber: #F0B44C;
      --red: #FF6B60;
      --on-accent: #06201A;
      --terminal: #0C0E0D;
      --scrim: rgba(0, 0, 0, 0.6);
      --attention: rgba(240,180,76,.10);
      --mono: 'SF Mono', Menlo, monospace;
      color-scheme: dark;
    }
    :root[data-theme='light'] {
      --bg: #FAFAF9;
      --bg-2: #F0F0EE;
      --bg-3: #E6E7E4;
      --selected: #E3F2EE;
      --tab-bg: #F0F0EE;
      --line: #DEE0DD;
      --text: #171A19;
      --text-2: #5B625F;
      --text-3: #6B7370;
      --accent: #0E7A64;
      --accent-soft: rgba(14,122,100,.12);
      --track: #E6E7E4;
      --static: #8A918E;
      --green: #1F7A3A;
      --amber: #A15C00;
      --red: #C2342B;
      --on-accent: #FFFFFF;
      --terminal: #FFFFFF;
      --scrim: rgba(40, 36, 30, 0.35);
      --attention: rgba(161,92,0,.10);
      color-scheme: light;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, system-ui, sans-serif;
      overflow: hidden;
    }
    #app {
      display: flex;
      height: 100%;
    }
    .mono {
      font-family: var(--mono);
    }

    /* --- Sidebar (left) --- */
    #sidebar {
      width: 272px;
      flex-shrink: 0;
      background: var(--bg-2);
      border-right: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      color: var(--text-2);
      font-size: 12.5px;
    }
    #sidebarTop {
      padding: 12px;
      display: flex;
      gap: 8px;
      -webkit-app-region: drag;
    }
    #btnNew {
      -webkit-app-region: no-drag;
      width: 100%;
      height: 36px;
      border-radius: 9px;
      border: 0;
      background: var(--accent);
      color: var(--on-accent);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    #btnNew:hover {
      filter: brightness(1.08);
    }
    #sessionLists {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding-bottom: 10px;
    }
    .sectionTitle {
      padding: 14px 12px 5px;
      font-family: var(--mono);
      font-size: 10.5px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--text-3);
      cursor: pointer;
      user-select: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .sectionTitle:hover {
      color: var(--text-2);
    }
    .sectionTitle .count {
      margin-left: 6px;
    }
    /* Chevron pinned to the right edge, sized to the label's text height */
    .sectionTitle .arrow {
      width: 1.2em;
      height: 1.2em;
      margin-left: auto;
      flex-shrink: 0;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.6;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: transform 0.12s;
    }
    .sectionTitle.collapsed .arrow {
      transform: rotate(-90deg);
    }
    .item {
      position: relative;
      margin: 2px 8px;
      padding: 9px 10px;
      border-radius: 9px;
      cursor: pointer;
    }
    .item {
      background: var(--tab-bg);
    }
    .item:hover {
      background: var(--bg-3);
    }
    .item.active {
      background: color-mix(in srgb, var(--green) 28%, var(--tab-bg));
      box-shadow: inset 0 0 0 1px var(--green);
    }
    .item.external {
      cursor: default;
    }
    .item.dragging {
      opacity: 0.4;
    }
    .item.dropBefore {
      box-shadow: inset 0 2px 0 var(--accent);
    }
    .item.dropAfter {
      box-shadow: inset 0 -2px 0 var(--accent);
    }
    .item .nameRow {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .item.active .name {
      font-weight: 600;
    }
    .item .src {
      flex-shrink: 0;
      font-family: var(--mono);
      font-size: 10.5px;
      color: var(--text-2);
    }
    .item.history {
      padding: 7px 10px;
    }
    .item.history .name {
      color: var(--text-2);
    }
    .item.history .src {
      color: var(--text-3);
    }
    .item .name {
      flex: 1;
      min-width: 0;
      color: var(--text);
      font-size: 13px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .model {
      flex-shrink: 0;
      font-family: var(--mono);
      font-size: 10.5px;
      color: var(--accent);
      white-space: nowrap;
    }
    .item .meta {
      display: flex;
      align-items: center;
      gap: 6px;
      padding-left: 16px;
      color: var(--text-2);
      font-family: var(--mono);
      font-size: 10.5px;
      margin-top: 5px;
      white-space: nowrap;
      overflow: hidden;
    }
    .item .meta .badge {
      padding: 1px 5px;
      border-radius: 4px;
      background: var(--line);
      color: var(--text);
    }
    .item .meta .sep {
      color: var(--text-3);
    }
    .item .meta .st {
      text-transform: uppercase;
    }
    .item .meta .st.busy {
      color: var(--accent);
    }
    .item .meta .st.waiting {
      color: var(--amber);
    }
    .item .meta .text {
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .item .dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      box-sizing: border-box;
      border-radius: 50%;
      background: var(--text-3);
      vertical-align: middle;
      flex-shrink: 0;
    }
    .dot.busy {
      background: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
      animation: pulse 1.2s ease-in-out infinite;
    }
    .dot.waiting {
      background: var(--amber);
    }
    .dot.idle {
      background: transparent;
      border: 1.5px solid var(--text-3);
    }
    /* A session waiting for you: the row breathes amber until you open it */
    .item.attention {
      background: var(--attention);
    }
    .item.attention .dot {
      background: var(--amber);
      animation: none;
    }
    @keyframes attention {
      0%,
      100% {
        background-color: transparent;
        box-shadow: inset 2px 0 0 transparent;
      }
      50% {
        background-color: var(--attention);
        box-shadow: inset 2px 0 0 var(--amber);
      }
    }
    @keyframes pulse {
      50% {
        opacity: 0.35;
      }
    }
    .item .actions {
      position: absolute;
      top: 5px;
      right: 6px;
      display: none;
      gap: 2px;
      padding-left: 6px;
      background: var(--bg-3);
      border-radius: 4px;
    }
    .item.active .actions {
      background: var(--selected);
    }
    .item:hover .actions {
      display: flex;
    }
    .item .btn {
      width: 18px;
      height: 18px;
      line-height: 17px;
      text-align: center;
      border-radius: 4px;
      color: var(--text-3);
      font-size: 12px;
    }
    .item .btn:hover {
      background: var(--line);
      color: var(--text);
    }
    .item input.rename,
    .tab input.rename {
      width: 100%;
      box-sizing: border-box;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--accent);
      border-radius: 4px;
      padding: 1px 4px;
      font: inherit;
      outline: none;
    }
    .empty {
      padding: 6px 12px;
      color: var(--text-3);
    }

    /* --- Status pill: BUSY / WAITING / IDLE --- */
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 1px 7px;
      border: 1px solid currentColor;
      border-radius: 999px;
      font-family: var(--mono);
      font-size: 9.5px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      line-height: 14px;
      flex-shrink: 0;
    }
    .pill::before {
      content: '';
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: currentColor;
    }
    .pill.busy {
      color: var(--accent);
    }
    .pill.waiting {
      color: var(--amber);
    }
    .pill.idle,
    .pill.ended {
      color: var(--text-3);
    }

    /* --- Main (right) --- */
    #main {
      position: relative;
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }
    /* Layout: sidebar left/right, or Safari-like tabs on top/bottom */
    #app.side-right {
      flex-direction: row-reverse;
    }
    #app.side-right #sidebar {
      border-right: 0;
      border-left: 1px solid var(--line);
    }
    #app.tabs-top #sidebar,
    #app.tabs-top #sidebarResize,
    #app.tabs-bottom #sidebar,
    #app.tabs-bottom #sidebarResize {
      display: none;
    }
    #app.tabs-bottom #tabBar {
      order: 10;
      border-bottom: 0;
      border-top: 1px solid var(--line);
    }
    #main > * {
      order: 1;
    }
    #tabBar {
      height: 48px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 0 8px;
      background: var(--bg);
      border-bottom: 1px solid var(--line);
      -webkit-app-region: drag;
    }
    #tabBar[hidden] {
      display: none;
    }
    /* Tabs shrink to their min width, then the row scrolls sideways. */
    #tabs {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 4px;
      height: 100%;
      overflow-x: auto;
      overflow-y: hidden;
      scrollbar-width: thin;
      -webkit-app-region: no-drag;
    }
    #tabs::-webkit-scrollbar {
      height: 4px;
    }
    #tabs::-webkit-scrollbar-thumb {
      background: var(--line);
      border-radius: 2px;
    }
    .tab {
      -webkit-app-region: no-drag;
      position: relative;
      flex: 1 1 0;
      min-width: 120px;
      max-width: 240px;
      height: 38px;
      box-sizing: border-box;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 0 8px;
      border-radius: 9px;
      color: var(--text-2);
      font-size: 12px;
      cursor: default;
      user-select: none;
    }
    /* Tabs and sidebar rows sit on a fill so they stand out from the bar. */
    .tab {
      background: var(--tab-bg);
    }
    .tab:hover {
      background: var(--bg-3);
    }
    .tab.busy,
    .item.busy {
      background: color-mix(in srgb, var(--accent) 16%, var(--tab-bg));
    }
    /* Same look as the active row in the sidebar. */
    .tab.attention {
      background: var(--attention);
    }
    /* The active tab/row stays green whatever its state, so you always see where you are. */
    .tab.active,
    .item.active.busy,
    .item.active.attention {
      background: color-mix(in srgb, var(--green) 28%, var(--tab-bg));
      box-shadow: inset 0 0 0 1px var(--green);
      color: var(--text);
    }
    .tab .icon,
    .tab .close {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--mono);
      font-size: 8.5px;
      font-weight: 700;
    }
    .tab .icon {
      color: var(--bg);
    }
    .tab .close {
      display: none;
      color: var(--text-2);
      font-size: 13px;
      font-family: inherit;
      font-weight: 400;
      cursor: pointer;
    }
    .tab .close:hover {
      background: var(--line);
      color: var(--text);
    }
    .tab:hover .icon {
      display: none;
    }
    .tab:hover .close {
      display: flex;
    }
    .tab .label {
      flex: 1;
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .tab .text {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 1px;
    }
    .tab .status {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 10.5px;
      color: var(--text-2);
      white-space: nowrap;
      overflow: hidden;
    }
    .tab .status.waiting {
      color: var(--text);
    }
    .tab .dot {
      flex-shrink: 0;
    }
    #sidebarTop #btnLayout {
      width: 36px;
      height: 36px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: var(--bg-3);
    }
    #btnTabNew,
    #btnLayout {
      -webkit-app-region: no-drag;
      width: 26px;
      height: 26px;
      flex-shrink: 0;
      border: 0;
      border-radius: 7px;
      background: transparent;
      color: var(--text-2);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    #btnTabNew:hover,
    #btnLayout:hover {
      background: var(--bg-3);
      color: var(--text);
    }
    #ctxMenu button.layoutItem {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    #ctxMenu .layoutItem .check {
      margin-left: auto;
      color: var(--accent);
    }
    #ctxMenu .layoutItem .key {
      margin-left: auto;
      font-family: var(--mono);
      font-size: 11px;
      color: var(--text-3);
    }
    #sessionHeader {
      height: 48px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 16px;
      background: var(--bg);
      border-bottom: 1px solid var(--line);
      -webkit-app-region: drag;
    }
    #sessionHeader .titleWrap {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: baseline;
      gap: 10px;
      overflow: hidden;
    }
    #headTitle {
      margin: 0;
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #headFolder {
      font-family: var(--mono);
      font-size: 11.5px;
      color: var(--text-2);
      white-space: nowrap;
    }
    #headCapsule {
      height: 24px;
      padding: 0 9px;
      border-radius: 12px;
      border: 1px solid var(--line);
      display: flex;
      align-items: center;
      font-family: var(--mono);
      font-size: 11px;
      white-space: nowrap;
    }
    #headCapsule[hidden] {
      display: none;
    }
    #statusbar {
      height: 38px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 16px;
      padding: 0 12px;
      background: var(--bg);
      border-bottom: 1px solid var(--line);
      color: var(--text-2);
      font-family: var(--mono);
      font-size: 11px;
      -webkit-app-region: drag;
      overflow: hidden;
    }
    #statusbar .stat {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    #statusbar .stat > span:last-child {
      color: var(--text);
    }
    #statusbar .mini {
      width: 48px;
      height: 4px;
      border-radius: 2px;
      background: var(--track);
    }
    #statusbar .mini > span {
      display: block;
      height: 4px;
      width: 0;
      border-radius: 2px;
      background: var(--accent);
    }
    #statusbar .mini.warn > span {
      background: var(--amber);
    }
    #statusbar .mini.danger > span {
      background: var(--red);
    }
    #workArea {
      flex: 1;
      display: flex;
      min-height: 0;
    }
    #statusbar .stat {
      white-space: nowrap;
    }
    #statusbar .stat > .warn {
      color: var(--amber);
    }
    #statusbar .stat > .danger {
      color: var(--red);
    }
    .pickers {
      margin-right: auto;
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: -apple-system, system-ui, sans-serif;
    }
    .pickers .pickerIcon {
      display: inline-flex;
      align-items: center;
      color: var(--text-2);
    }
    .pickers select {
      -webkit-app-region: no-drag;
      height: 26px;
      background: var(--bg-3);
      border: 1px solid var(--line);
      border-radius: 7px;
      color: var(--text);
      font-size: 12px;
      padding: 0 6px;
      cursor: pointer;
    }
    .pickers select:hover,
    .toggle:hover {
      border-color: var(--accent);
    }
    .toggle {
      -webkit-app-region: no-drag;
      display: flex;
      align-items: center;
      gap: 6px;
      height: 26px;
      border: 1px solid transparent;
      border-radius: 7px;
      color: var(--text-2);
      font-size: 12px;
      padding: 0 8px;
      cursor: pointer;
      user-select: none;
    }
    .toggle input {
      margin: 0;
      accent-color: var(--accent);
      cursor: pointer;
    }
    .toggle.disabled {
      opacity: 0.5;
      cursor: default;
    }
    #terminals {
      position: relative;
      flex: 1;
      min-width: 0;
      background: var(--terminal);
    }
    .termPane {
      position: absolute;
      inset: 0;
      padding: 4px 4px 4px 8px;
      box-sizing: border-box;
      display: none;
    }
    .termPane.visible {
      display: block;
    }
    #placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-3);
      font-size: 14px;
    }

    /* --- Session detail panel --- */
    #detail {
      width: 332px;
      flex-shrink: 0;
      background: var(--bg-2);
      border-left: 1px solid var(--line);
      display: none;
      flex-direction: column;
      min-height: 0;
      overflow: hidden;
      z-index: 5;
      color: var(--text);
      font-size: 13px;
    }
    #detail.open {
      display: flex;
    }
    #detailHead {
      position: relative;
      padding: 16px 48px 14px 18px;
      border-bottom: 1px solid var(--line);
    }
    #detailProject {
      font-family: var(--mono);
      font-size: 10.5px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text-3);
    }
    #detailTitle {
      margin-top: 4px;
      font-size: 15px;
      font-weight: 600;
      line-height: 1.3;
    }
    #detailClose {
      position: absolute;
      top: 14px;
      right: 14px;
      width: 26px;
      height: 26px;
      border: 1px solid var(--line);
      border-radius: 5px;
      background: var(--bg);
      color: var(--text-2);
      cursor: pointer;
      font-size: 14px;
      line-height: 1;
    }
    #detailClose:hover {
      color: var(--text);
      border-color: var(--accent);
    }
    #detailBody {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 0 20px 24px;
    }
    .dSection {
      padding: 16px 0;
      border-bottom: 1px solid var(--line);
    }
    .dSection:last-child {
      border-bottom: none;
    }
    .dLabel {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text-3);
    }
    .dSection > .dLabel {
      margin-bottom: 12px;
      color: var(--text-2);
      font-weight: 600;
    }
    .dTop {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      color: var(--text-3);
      font-size: 12px;
    }
    .dTop .model {
      font-size: 12px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px 10px;
    }
    .grid .val {
      margin-top: 3px;
      font-size: 16px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }
    .grid .val.accent {
      color: var(--accent);
    }
    .note {
      margin-top: 10px;
      color: var(--text-3);
      font-size: 11.5px;
      line-height: 1.45;
    }
    .bar {
      position: relative;
      display: flex;
      height: 6px;
      border-radius: 3px;
      background: var(--track);
      overflow: hidden;
    }
    .bar > span {
      height: 100%;
    }
    .bar .static {
      background: var(--static);
    }
    .bar .conv,
    .bar .fill {
      background: var(--accent);
    }
    .bar .fill.muted {
      background: var(--static);
    }
    .ctxBar {
      margin-bottom: 12px;
    }
    .row {
      margin-bottom: 10px;
    }
    .row .rowHead {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 5px;
    }
    .row .rowName {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .row .rowName.muted {
      color: var(--text-2);
    }
    .row .rowVal {
      flex-shrink: 0;
      font-family: var(--mono);
      font-size: 11.5px;
      color: var(--text-2);
    }
    .row .bar {
      height: 3px;
    }
    .list {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 6px 12px;
      font-size: 12.5px;
    }
    .list .num {
      font-family: var(--mono);
      font-size: 11.5px;
      color: var(--text-2);
      text-align: right;
    }
    .sub {
      margin: 14px 0 8px;
    }
    .linkBtn {
      margin-top: 8px;
      background: none;
      border: none;
      padding: 0;
      color: var(--accent);
      font-size: 12px;
      cursor: pointer;
    }
    .resume {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--bg);
      font-family: var(--mono);
      font-size: 11.5px;
    }
    .resume code {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .resume button {
      background: none;
      border: 1px solid var(--line);
      border-radius: 4px;
      color: var(--text-2);
      font-size: 11px;
      padding: 2px 8px;
      cursor: pointer;
    }
    .resume button:hover {
      border-color: var(--accent);
      color: var(--text);
    }

    /* --- Launch modal --- */
    #launchModal,
    #settingsModal {
      position: fixed;
      inset: 0;
      background: var(--scrim);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }
    #launchModal.open,
    #settingsModal.open {
      display: flex;
    }
    #launchModal .box,
    #settingsModal .box {
      background: var(--bg-2);
      border: 1px solid var(--line);
      border-top: 2px solid var(--accent);
      border-radius: 10px;
      padding: 22px 26px;
      width: 480px;
      max-height: calc(100vh - 40px);
      overflow-y: auto;
      box-sizing: border-box;
      color: var(--text);
    }
    #launchModal h2,
    #settingsModal h2 {
      margin: 0 0 6px;
      font-size: 15px;
      font-weight: 600;
    }
    #launchSubtitle {
      margin: 0 0 14px;
      font-size: 12px;
      color: var(--text-2);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .pickLabel {
      margin: 16px 0 7px;
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text-3);
    }
    .optList {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .opt {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 7px 10px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: var(--bg);
      color: var(--text);
      text-align: left;
      cursor: pointer;
      font: inherit;
    }
    .opt:hover {
      border-color: var(--text-3);
    }
    .opt.selected {
      border-color: var(--accent);
      background: var(--accent-soft);
    }
    .optText {
      flex: 1;
      min-width: 0;
    }
    .optName {
      font-size: 13px;
      font-weight: 600;
    }
    .opt.selected .optName {
      color: var(--accent);
    }
    .optDesc {
      margin-top: 1px;
      font-size: 11.5px;
      color: var(--text-3);
    }
    .opt .check {
      color: var(--accent);
      visibility: hidden;
    }
    .opt.selected .check {
      visibility: visible;
    }
    .seg {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      border: 1px solid var(--line);
      border-radius: 7px;
      overflow: hidden;
    }
    .segBtn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      padding: 6px 2px;
      border: none;
      border-left: 1px solid var(--line);
      background: var(--bg);
      color: var(--text-2);
      font-size: 11px;
      cursor: pointer;
      white-space: nowrap;
    }
    .segBtn:disabled {
      opacity: 0.4;
      cursor: default;
    }
    .segBtn:first-child {
      border-left: none;
    }
    .meter {
      display: flex;
      gap: 2px;
      height: 10px;
      align-items: center;
    }
    .meter i {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      border: 1px solid currentColor;
      opacity: 0.45;
    }
    .meter i.on {
      background: currentColor;
      opacity: 1;
    }
    .meter.auto i {
      border-style: dashed;
    }
    .segBtn:hover {
      color: var(--text);
    }
    .segBtn.selected {
      background: var(--accent-soft);
      color: var(--accent);
      font-weight: 600;
    }
    #effortHint {
      margin: 7px 0 0;
      font-size: 11.5px;
      color: var(--text-3);
    }
    .folderRow {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 6px 6px 10px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: var(--bg);
    }
    #folderPath {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-family: var(--mono);
      font-size: 11.5px;
    }
    #btnFolder {
      background: none;
      border: 1px solid var(--line);
      border-radius: 5px;
      color: var(--text-2);
      font-size: 11.5px;
      padding: 3px 9px;
      cursor: pointer;
    }
    #btnFolder:hover {
      border-color: var(--accent);
      color: var(--text);
    }
    #launchModal .modeBtn {
      display: block;
      width: 100%;
      margin-top: 8px;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: var(--bg-3);
      color: var(--text);
      font-size: 13px;
      cursor: pointer;
      text-align: left;
    }
    #launchModal .modeBtn:hover {
      border-color: var(--accent);
    }
    #launchModal .modeBtn .cmd {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--accent);
      font-family: var(--mono);
      font-size: 11.5px;
      margin-top: 3px;
    }
    #btnNormal {
      margin-top: 16px;
    }
    #btnCancel,
    #btnSettingsDone {
      margin-top: 12px;
      background: none;
      border: none;
      color: var(--text-3);
      font-size: 12px;
      cursor: pointer;
      padding: 0;
    }
    #sidebarResize {
      width: 5px;
      margin-left: -3px;
      flex-shrink: 0;
      cursor: col-resize;
      z-index: 2;
    }
    #sidebarResize:hover,
    #sidebarResize.dragging {
      background: var(--accent);
      opacity: 0.5;
    }
    #btnSettings {
      -webkit-app-region: no-drag;
      width: 34px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-3);
      border: 1px solid var(--line);
      border-radius: 7px;
      color: var(--text-2);
      padding: 0;
      cursor: pointer;
    }
    #btnSettings:hover {
      border-color: var(--accent);
    }
    .tagHead {
      margin-top: 18px;
      font-family: var(--mono);
      font-size: 10.5px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-3);
    }
    .tagHint {
      margin: 6px 0 0;
      font-size: 12px;
      color: var(--text-2);
    }
    .tagRow {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
      font-size: 13px;
    }
    .tagRow .agentName {
      flex: 1;
    }
    .tagRow input[type='text'] {
      width: 120px;
      height: 26px;
      box-sizing: border-box;
      padding: 0 8px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: var(--bg-3);
      font-family: var(--mono);
      font-size: 12px;
    }
    .tagRow input[type='color'] {
      width: 30px;
      height: 26px;
      padding: 0;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: transparent;
      cursor: pointer;
    }
    .sizeRow {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 10px;
      font-size: 13px;
    }
    .stepper {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .stepper button {
      width: 26px;
      height: 26px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      cursor: pointer;
    }
    .stepper button:hover {
      border-color: var(--accent);
    }
    .stepper output {
      min-width: 64px;
      text-align: center;
      font-family: var(--mono);
      font-size: 12px;
    }
    #btnSettingsReset {
      margin-top: 16px;
      background: none;
      border: 1px solid var(--line);
      border-radius: 6px;
      color: var(--text-2);
      font-size: 12px;
      padding: 4px 10px;
      cursor: pointer;
    }
    #ctxMenu {
      position: fixed;
      z-index: 20;
      min-width: 200px;
      padding: 4px;
      background: var(--bg-2);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.25);
    }
    #ctxMenu button {
      display: block;
      width: 100%;
      padding: 6px 10px;
      border: none;
      border-radius: 5px;
      background: none;
      color: var(--text);
      font-size: 12.5px;
      text-align: left;
      cursor: pointer;
    }
    #ctxMenu button:hover {
      background: var(--bg-3);
    }
    #ctxMenu hr {
      margin: 4px 6px;
      border: none;
      border-top: 1px solid var(--line);
    }
  </style>
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div id="sidebarTop">
        <button id="btnNew">+ New session</button>
        <button id="btnLayout" type="button" aria-haspopup="menu"></button>
      </div>
      <div id="sessionLists">
        <div class="sectionTitle" data-list="activeList">
          <span id="lblActive">Active</span><svg class="arrow" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 4.25 6 7.75l3.5-3.5"/></svg>
        </div>
        <div id="activeList"></div>
        <div class="sectionTitle" data-list="externalList" id="externalTitle">
          <span id="lblExternal">Other terminals</span><span class="count" id="externalCount"></span><svg class="arrow" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 4.25 6 7.75l3.5-3.5"/></svg>
        </div>
        <div id="externalList"></div>
        <div class="sectionTitle collapsed" data-list="historyList">
          <span id="lblHistory">History</span><svg class="arrow" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 4.25 6 7.75l3.5-3.5"/></svg>
        </div>
        <div id="historyList" hidden></div>
      </div>
    </aside>
    <div id="sidebarResize"></div>

    <section id="main">
      <div id="tabBar" hidden>
        <div id="tabs"></div>
        <button id="btnTabNew" type="button" title="New session">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </div>
      <div id="sessionHeader">
        <div class="titleWrap">
          <h1 id="headTitle">ClaudeTerm</h1>
          <span id="headFolder"></span>
        </div>
        <span id="headCapsule" hidden></span>
      </div>
      <div id="statusbar">
        <div class="pickers">
          <button id="btnSettings" type="button" title="Settings"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
          <span class="pickerIcon" aria-hidden="true"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg></span>
          <select id="langPicker" title="Language">
            <option value="en">EN</option>
            <option value="de">DE</option>
            <option value="tr">TR</option>
            <option value="es">ES</option>
          </select>
          <select id="themePicker"></select>
          <label class="toggle" id="loginToggle"><input type="checkbox" id="loginCheck" /><span id="lblLogin">Open at login</span></label>
        </div>
        <span class="stat"><span class="label" id="lblContext">context:</span><span id="tokenCount">—</span></span>
        <span class="stat"><span class="label" id="lblFiveHour">5-hour limit:</span><span class="mini" aria-hidden="true"><span id="fiveHourBar"></span></span><span id="fiveHourLimit">—</span></span>
        <span class="stat"><span class="label" id="lblWeekly">weekly limit:</span><span class="mini" aria-hidden="true"><span id="weeklyBar"></span></span><span id="weeklyLimit">—</span></span>
      </div>
      <div id="workArea">
      <div id="terminals">
        <div id="placeholder"></div>
      </div>

      <aside id="detail" aria-hidden="true">
        <div id="detailHead">
          <div id="detailProject"></div>
          <div id="detailTitle"></div>
          <button id="detailClose" title="Esc">×</button>
        </div>
        <div id="detailBody"></div>
      </aside>
      </div>
    </section>
  </div>

  <div id="launchModal">
    <div class="box">
      <h2 id="launchTitle">How should Claude Code start?</h2>
      <p id="launchSubtitle"></p>
      <div class="pickLabel" id="agentLabel">Agent</div>
      <div id="agentSeg" class="seg"></div>
      <div class="pickLabel" id="modelLabel">Model</div>
      <div id="modelList" class="optList"></div>
      <div class="pickLabel" id="effortLabel">Effort</div>
      <div id="effortSeg" class="seg"></div>
      <p id="effortHint"></p>
      <div class="pickLabel" id="folderLabel">Folder</div>
      <div class="folderRow">
        <code id="folderPath"></code>
        <button id="btnFolder" type="button">Change…</button>
      </div>
      <button class="modeBtn" id="btnNormal">
        <span id="launchNormalLabel">Normal</span>
        <span class="cmd" id="cmdNormal">claude</span>
      </button>
      <button class="modeBtn" id="btnSkipPerm">
        <span id="launchSkipLabel">Skip permission prompts</span>
        <span class="cmd" id="cmdSkip">claude --dangerously-skip-permissions</span>
      </button>
      <button id="btnCancel">Cancel</button>
    </div>
  </div>

  <div id="settingsModal">
    <div class="box">
      <h2 id="settingsTitle">Settings</h2>
      <div class="sizeRow">
        <span id="lblTermFont">Terminal text size</span>
        <span class="stepper"><button type="button" data-size="term" data-step="-1">−</button><output id="termFontValue"></output><button type="button" data-size="term" data-step="1">+</button></span>
      </div>
      <div class="sizeRow">
        <span id="lblSidebarFont">Sidebar text size</span>
        <span class="stepper"><button type="button" data-size="sidebar" data-step="-1">−</button><output id="sidebarFontValue"></output><button type="button" data-size="sidebar" data-step="1">+</button></span>
      </div>
      <div class="tagHead" id="lblAgentTags">Agent name tags</div>
      <p class="tagHint" id="tagHint">Each agent starts its replies with this tag, shown in its colour.</p>
      <div id="tagRows"></div>
      <div class="sizeRow">
        <span id="lblLayout">Sessions</span>
        <select id="layoutPicker"></select>
      </div>
      <button id="btnSettingsReset" type="button">Reset</button>
      <div><button id="btnSettingsDone" type="button">Done</button></div>
    </div>
  </div>

  <div id="ctxMenu" hidden></div>

  <script src="node_modules/@xterm/xterm/lib/xterm.js"></script>
  <script src="node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
  <script src="node_modules/@xterm/addon-webgl/lib/addon-webgl.js"></script>
  <script src="i18n.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
