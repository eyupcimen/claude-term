<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>ClaudeTerm</title>
  <link rel="stylesheet" href="node_modules/@xterm/xterm/css/xterm.css" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #1e1e1e;
      font-family: -apple-system, system-ui, sans-serif;
    }
    #statusbar {
      min-height: 32px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 18px;
      padding: 0 14px;
      background: #252526;
      border-bottom: 1px solid #333;
      color: #9cdcfe;
      font-size: 12.5px;
      -webkit-app-region: drag;
      flex-wrap: wrap;
    }
    #statusbar .stat {
      white-space: nowrap;
    }
    #statusbar .label {
      color: #888;
      margin-right: 5px;
    }
    #statusbar .warn {
      color: #e5c07b;
    }
    #statusbar .danger {
      color: #e06c75;
    }
    #langPicker {
      margin-right: auto;
      -webkit-app-region: no-drag;
      background: transparent;
      border: 1px solid #444;
      border-radius: 6px;
      color: #ccc;
      font-size: 12px;
      padding: 2px 5px;
      cursor: pointer;
    }
    #langPicker:hover {
      border-color: #5a9fd4;
    }
    #terminal {
      position: absolute;
      top: 32px;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 4px;
      box-sizing: border-box;
    }
    #launchModal {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }
    #launchModal .box {
      background: #252526;
      border: 1px solid #3a3a3a;
      border-radius: 10px;
      padding: 24px 28px;
      width: 420px;
      color: #ddd;
      font-family: -apple-system, system-ui, sans-serif;
    }
    #launchModal h2 {
      margin: 0 0 14px;
      font-size: 15px;
      font-weight: 600;
    }
    #launchModal .modelRow {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
      color: #bbb;
    }
    #modelPicker {
      background: #333;
      color: #eee;
      border: 1px solid #444;
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 13px;
    }
    #launchModal button {
      display: block;
      width: 100%;
      margin-top: 10px;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #444;
      background: #333;
      color: #eee;
      font-size: 13px;
      cursor: pointer;
      text-align: left;
    }
    #launchModal button:hover {
      background: #3a3a3a;
      border-color: #5a9fd4;
    }
    #launchModal button .cmd {
      display: block;
      color: #9cdcfe;
      font-family: Menlo, monospace;
      font-size: 11.5px;
      margin-top: 3px;
    }
  </style>
</head>
<body>
  <div id="statusbar">
    <select id="langPicker" title="Language">
      <option value="en">🌐 EN</option>
      <option value="de">🌐 DE</option>
      <option value="tr">🌐 TR</option>
      <option value="es">🌐 ES</option>
    </select>
    <span class="stat"><span class="label" id="lblContext">context:</span><span id="tokenCount">—</span></span>
    <span class="stat"><span class="label" id="lblFiveHour">5-hour limit:</span><span id="fiveHourLimit">—</span></span>
    <span class="stat"><span class="label" id="lblWeekly">weekly limit:</span><span id="weeklyLimit">—</span></span>
  </div>
  <div id="terminal"></div>

  <div id="launchModal">
    <div class="box">
      <h2 id="launchTitle">How should Claude Code start?</h2>
      <label class="modelRow">
        <span id="modelLabel">Model</span>
        <select id="modelPicker">
          <option value="" id="modelDefaultOpt">Default</option>
          <option value="sonnet">Sonnet</option>
          <option value="opus">Opus</option>
          <option value="haiku">Haiku</option>
        </select>
      </label>
      <button id="btnNormal">
        <span id="launchNormalLabel">Normal</span>
        <span class="cmd">claude</span>
      </button>
      <button id="btnSkipPerm">
        <span id="launchSkipLabel">Skip permission prompts</span>
        <span class="cmd">claude --dangerously-skip-permissions</span>
      </button>
    </div>
  </div>

  <script src="node_modules/@xterm/xterm/lib/xterm.js"></script>
  <script src="node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
  <script src="i18n.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
